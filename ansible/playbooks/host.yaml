---
- name: Configure OS level settings
  hosts: vps
  remote_user: "{{ vps_user }}"
  become: true

  roles:
    - role: schwitzd.collection.sshd_hardening
      vars:
        sshd_hardening_allowed_users:
          - "{{ vps_user }}"
      tags: ssh

    - role: githubixx.ansible_role_wireguard
      vars:
        wireguard_interface: "wg0"
        wireguard_port: "51821"
        wireguard_mtu: "1280"
        wireguard_addresses:
          - "{{ vps_ipv6_ula }}"
        wireguard_unmanaged_peers:
          mikrotik:
            public_key: "{{ mikrotik_wireguard_public_key }}"
            allowed_ips: "{{ mikrotik_ipv6_ula }}, {{ mikrotik_server_vlan }}, {{ mikrotik_home_vlan }}"
            persistent_keepalive: 0
        wireguard_save_config: |
          true
          ListenPort = 51821
      tags: wireguard

  tasks:
    - name: Install required host utilities
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
          - unattended-upgrades
          - tcpdump
          - nftables
          - python3-packaging
          - gpg
          - curl
        state: present
        update_cache: true
      tags: apt

    - name: Ensure qemu-guest-agent is enabled and running
      ansible.builtin.service:
        name: qemu-guest-agent
        enabled: true
        state: started
      tags: apt

    # DNS
    - name: Install unbound and DNS tools
      ansible.builtin.apt:
        name:
          - unbound
          - bind9-dnsutils
        state: present
        update_cache: true
      tags: dns

    - name: Deploy unbound configuration
      ansible.builtin.template:
        src: unbound.conf.j2
        dest: /etc/unbound/unbound.conf.d/vps.conf
        owner: root
        group: root
        mode: "0644"
        validate: unbound-checkconf %s
      notify: Restart unbound
      tags: dns

    - name: Ensure unbound is enabled and running
      ansible.builtin.service:
        name: unbound
        enabled: true
        state: started
      tags: dns

    - name: Flush handlers so unbound is up before touching resolv.conf
      ansible.builtin.meta: flush_handlers
      tags: dns

    - name: Check unbound resolves an IPv4-only name (DNS64)
      ansible.builtin.command: dig +short AAAA github.com @::1
      register: dns64_check
      changed_when: false
      failed_when: nat64_prefix.split('::')[0].split(':')[:4] | join(':') not in dns64_check.stdout
      tags: dns

    - name: Point the host resolver at unbound
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          nameserver ::1
      tags: dns

    # Nftables
    - name: Ensure nftables service is enabled and running
      ansible.builtin.service:
        name: nftables
        enabled: true
        state: started
      tags: nft

    - name: Deploy nftables configuration
      ansible.builtin.template:
        src: nftables.conf.j2
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: "0644"
        validate: nft -c -f %s
      notify: Reload nftables
      tags: nft

    # unattended upgrades
    - name: Enable periodic apt actions (update + unattended upgrades)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
      become: true
      notify: Restart unattended-upgrades timer
      tags: unattended-upgrades

    - name: Configure unattended-upgrades allowed origins
      ansible.builtin.template:
        src: 50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: "0644"
      notify: Restart unattended-upgrades timer
      tags: unattended-upgrades

    # Swap
    - name: Allocate swapfile
      ansible.builtin.command:
        cmd: fallocate -l {{ swap_size }} /swapfile
        creates: /swapfile
      register: swapfile_created
      tags: swap

    - name: Set swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
      tags: swap

    - name: Format swapfile
      ansible.builtin.command:
        cmd: mkswap /swapfile
      when: swapfile_created.changed
      tags: swap

    - name: Enable swap
      ansible.builtin.command:
        cmd: swapon /swapfile
      when: swapfile_created.changed
      tags: swap

    - name: Set vm.swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        state: present
        sysctl_file: /etc/sysctl.d/99-swappiness.conf
        reload: true
      tags: swap

    - name: Add swapfile to fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: '/swapfile none swap sw 0 0'
        state: present
      tags: swap

    - name: Ensure systemd timers for apt are enabled
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      tags: unattended-upgrades

  handlers:
    - name: Restart unbound
      ansible.builtin.service:
        name: unbound
        state: restarted

    - name: Reload nftables
      ansible.builtin.service:
        name: nftables
        state: reloaded

    - name: Restart unattended-upgrades timer
      ansible.builtin.systemd:
        name: apt-daily-upgrade.timer
        state: restarted
